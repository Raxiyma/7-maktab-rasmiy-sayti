
<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-maktab — Jańalıqlar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
            color: #24324a;
        }

        header {
            background: linear-gradient(120deg, #0754a5, #1686d9);
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .news-card {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #00000012;
        }

        .news-card h3 {
            color: #0754a5;
        }

        .news-card img {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 10px;
        }

        .date {
            color: #718096;
            font-size: 14px;
        }

        footer {
            background: #073b72;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>7-SONLI MAKTAB</h1>
    <h2>MAKTAB JAŃALÍQLARÍ</h2>
    <p>Bilim — baxıtlı keleshek tiykarı!</p>
</header>

<main>
    <h2>Sońǵı jańalıqlar</h2>
    <div id="news-list">Jańalıqlar júklenbekte...</div>
</main>

<footer>
    <p>7-sanlı ulıwma bilim beriw mektebi</p>
    <p>Bilim — baxıtlı keleshek tiykarı!</p>
</footer>

<script>
const apiUrl =
"https://api.github.com/repos/Raxiyma/7-maktab-rasmiy-sayti/contents/news";

async function loadNews() {
    const container = document.getElementById("news-list");

    try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
            throw new Error("Jańalıqlardı júklew múmkin bolmadı");
        }

        const files = await response.json();

        const newsFiles = files.filter(file =>
            file.name.endsWith(".md")
        );

        const articles = await Promise.all(
            newsFiles.map(async file => {
                const result = await fetch(file.download_url);
                const raw = await result.text();

                const match = raw.match(
                    /^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?([\s\S]*)$/
                );

                if (!match) return null;

                const metadata = match[1];
                const body = match[2].trim();

                function getField(name) {
                    const field = metadata.match(
                        new RegExp("^" + name + ":\\s*(.*)$", "m")
                    );

                    return field
                        ? field[1].trim().replace(/^["']|["']$/g, "")
                        : "";
                }

                return {
                    title: getField("title"),
                    date: getField("date"),
                    image: getField("image"),
                    body: body
                };
            })
        );

        container.innerHTML = "";

        articles
            .filter(article => article && article.title)
            .sort((a, b) => b.date.localeCompare(a.date))
            .forEach(article => {
                const card = document.createElement("article");
                card.className = "news-card";

                const title = document.createElement("h3");
                title.textContent = article.title;
                card.appendChild(title);

                if (article.date) {
                    const date = document.createElement("p");
                    date.className = "date";
                    date.textContent = article.date;
                    card.appendChild(date);
                }

                if (article.image) {
                    const img = document.createElement("img");
                    img.src = article.image;
                    img.alt = article.title;
                    card.appendChild(img);
                }

                article.body.split(/\n\s*\n/).forEach(paragraph => {
                    if (paragraph.trim()) {
                        const p = document.createElement("p");
                        p.textContent = paragraph.trim();
                        card.appendChild(p);
                    }
                });

                container.appendChild(card);
            });

        if (container.children.length === 0) {
            container.textContent = "Házirge jańalıqlar joq.";
        }

    } catch (error) {
        container.textContent =
            "Jańalıqlardı júklewde qátelik júz berdi. Keyinirek qayta urınıp kóriń.";
        console.error(error);
    }
}

loadNews();
</script>

</body>
</html>
